name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  powershell-validation:
    name: Validate (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            shell: pwsh
          - name: Windows PowerShell 5.1
            shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install validation modules
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          $pesterInstall = @{
            Name = 'Pester'
            RequiredVersion = '5.9.1'
            Scope = 'CurrentUser'
            Force = $true
          }
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            # Windows includes an older Microsoft-signed Pester. The gallery
            # build has a different publisher, so unattended side-by-side
            # installation requires acknowledging that publisher transition.
            $pesterInstall.SkipPublisherCheck = $true
          }

          Install-Module @pesterInstall
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run parser, analyzer, and Pester validation
        shell: ${{ matrix.shell }}
        run: ./tools/Invoke-LocalValidation.ps1
